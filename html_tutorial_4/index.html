<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image and File Path</title>
</head>
<body>
    <img src="tree.png" width="200" height="200" alt="Sample Image">

    <img src="https://img.magnific.com/free-vector/forest-trees-glyph_78370-1747.jpg" width="400" height="400" alt="Sample Image in Subfolder">
</body>
</html>

<!-- 
    name.png = The file is in the same folder as the HTML file.
    images/name.png = The file is in a subfolder called "images".
    /images/name.png = The file is in a subfolder called "images" at the root of the website.
    ../name.png = The file is in the parent folder of the HTML file.
    Absolute path = The file is located at a specific URL, such as "https://example.com/images/name.png".
-->
